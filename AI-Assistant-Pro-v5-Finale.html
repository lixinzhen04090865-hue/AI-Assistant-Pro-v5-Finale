      function createThinkingComponent(thinking, isActive = false, finalTime = null) {
        const thinkBar = document.createElement('div');
        thinkBar.className = `tm-thinkbar ${isActive ? '' : 'collapsed'}`;
        thinkBar.innerHTML = `
          <div class="tm-head">
            <span class="tm-emoji">💡</span>
            <span class="tm-label">${isActive ? '思考中' : '已深度思考'}</span>

            <div class="tm-tools">
              <button class="tm-btn tm-copy" title="复制思考" aria-label="复制思考">复制</button>
            </div>
          </div>
          <div class="tm-stream">
            <ul class="tm-list"></ul>
          </div>`;

        const list = thinkBar.querySelector('.tm-list');
        const stream = thinkBar.querySelector('.tm-stream');
        
        if (thinking) {
          const thinkingLines = thinking
            .split(/\n+/)
            .map(line => line.trim())
            .filter(line => line.length > 0);
          
          thinkingLines.forEach(line => {
            const li = document.createElement('li');
            li.textContent = line;
            list.appendChild(li);
          });
        }

        thinkBar.querySelector('.tm-copy').onclick = async () => {
          const text = Array.from(list.children).map(li => li.textContent).join('\n');
          try { 
            await navigator.clipboard.writeText(text); 
            showToast('思考已复制'); 
          } catch { 
            showToast('复制失败'); 
          }
        };

        setTimeout(() => {
          if (list.children.length > 0) {
            stream.scrollTop = stream.scrollHeight;
          }
        }, 50);

        return thinkBar;
      }

      function ensureThinkBar(){
        if (THINK._bar) return;
        const bar = createThinkingComponent('', true);
        bar.id = 'tm-thinkbar';
        bar.setAttribute('aria-live','polite');
        THINK._bar = bar;
        THINK._list = bar.querySelector('.tm-list');
        THINK._stream = bar.querySelector('.tm-stream');
        THINK._time = bar.querySelector('.tm-time');
      }

      function placeUnderLastUser(){
        const box = document.getElementById('messages');
        if(!box) return;
        const lastUser = box.querySelector('.message.user:last-of-type');
        if (lastUser && lastUser.parentNode){
          lastUser.parentNode.insertBefore(THINK._bar, lastUser.nextSibling);
        } else {
          box.appendChild(THINK._bar);
        }
      }

      function tickStart(){
        clearInterval(THINK._timer);
        THINK._t0 = performance.now();
        THINK._timer = setInterval(()=> {
          THINK._time.textContent = '(' + ((performance.now()-THINK._t0)/1000).toFixed(1) + 's)';
        }, 100);
      }
      function tickStop(){ clearInterval(THINK._timer); THINK._timer=null; }

      function pump(){
        if (THINK._moving || !THINK._q.length) return;
        THINK._moving = true;
        
        const li = document.createElement('li'); 
        li.textContent = THINK._q.shift();
        THINK._list.appendChild(li);
        
        if (THINK._stream) {
          THINK._stream.scrollTop = THINK._stream.scrollHeight;
        }
        
        requestAnimationFrame(() => {
          THINK._moving = false; 
          pump(); 
          if (THINK._stream) {
            THINK._stream.scrollTop = THINK._stream.scrollHeight;
          }
        });
      }

      THINK.chunk = function(text){ 
        if(!text) return;
        THINK._pending = (THINK._pending || '') + text;
        const parts = THINK._pending.split(/(?<=[。！？；.!?;])\s*|\n+/);
        THINK._pending = parts.pop() || '';
        for (const p of parts) {
          const line = p.trim();
          if (line && line.length > 2) {
            THINK._q.push(line); 
            pump();
          }
        }
      };

      window.THINK = window.THINK || {};
      
      THINK.start = function(){
        ensureThinkBar();
        THINK._list.innerHTML = '<li>开始思考...</li>';
        THINK._q.length = 0; 
        THINK._pending = '';
        THINK._moving=false;
        THINK._bar.querySelector('.tm-label').textContent = '思考中';
        THINK._bar.classList.remove('collapsed');
        THINK._bar.style.display='block';
        placeUnderLastUser();

        const isStreaming = (state.settings?.streaming !== false);
        if (isStreaming) {
          tickStart();
        } else {
          THINK._time.textContent = '(—)';
        }
        
        setTimeout(() => {
          if (THINK._stream) {
            THINK._stream.scrollTop = 0;
          }
        }, 50);
      };

      THINK.finish = function(messageId, overrides = {}){
        if(!THINK._bar) return;

        if (overrides.text) {
          const lines = String(overrides.text)
            .split(/\n+/)
            .map(s => s.trim())
            .filter(Boolean);
          THINK._list.innerHTML = '';
          for (const ln of lines) {
            const li = document.createElement('li');
            li.textContent = ln;
            THINK._list.appendChild(li);
          }
        }

        const usingOverrideTime = typeof overrides.timeText === 'string';
        const finalTime = usingOverrideTime
          ? overrides.timeText
          : ((performance.now() - THINK._t0) / 1000).toFixed(1);

        THINK._time.textContent = `(${finalTime}${usingOverrideTime ? '' : 's'})`;
        tickStop();

        const allText = Array.from(THINK._list.children)
          .map(li => li.textContent)
          .join('\n');

        const ms = usingOverrideTime ? null : (parseFloat(finalTime) * 1000);

        persistReasoningToMsg(messageId, allText, ms);
        THINK._bar.querySelector('.tm-label').textContent = '已深度思考';
        THINK._bar.classList.add('collapsed');
        THINK._bar.style.display = 'block';
        THINK._bar.style.opacity = '1';
      };

      function findMessageById(messageId){
        const session = getCurrentSession();
        if (!session || !Array.isArray(session.messages)) return null;
        const idx = session.messages.findIndex(m => m.id === messageId);
        return idx >= 0 ? { session, idx, msg: session.messages[idx] } : null;
      }

      function persistReasoningToMsg(messageId, reasoningText, durationMs, collapsed = true){
        const session = getCurrentSession();
        if (!session || !session.messages) return;
        const messageIndex = session.messages.length - 1;
        if (messageIndex >= 0 && session.messages[messageIndex]) {
          const msg = session.messages[messageIndex];
          msg.reasoning = String(reasoningText || '').trim();
          msg.reasoningMs = (typeof durationMs === 'number') ? durationMs : null;
          msg.reasoningCollapsed = !!collapsed;
          saveSessions();
        }
      }

        const session = getCurrentSession();
        if (!session || !session.messages || messageIndex < 0) return;
        if (session.messages[messageIndex]) {
          session.messages[messageIndex].canvas = !!on;
          saveSessions();
        }
        const messageElement = dom.messagesContainer.querySelector(`.message[data-message-index="${messageIndex}"]`);

          const editBtns = messageElement.querySelectorAll('.regenerate-btn, .canvas-action-btn');

            btn.classList.toggle('is-disabled', !on);
            btn.disabled = !on;
          });
        }

      function loadSettings() {
        const defaultSettings = {
            baseUrl: 'https://spinsnow.fun/lmarena-api',
            endpointPath: '/chat/completions',
            fullEndpointMode: false,
            apiKey: 'api-key',
            model: 'claude-sonnet-4-20250514-thinking-32k',
            systemPrompt: '',
            customHeaders: [],
            customBody: [],
            streaming: true
        };

        try {
            const saved = localStorage.getItem('lma_settings');
            if (saved) {
                const savedSettings = JSON.parse(saved);
                state.settings = { ...defaultSettings, ...savedSettings };
                
                const known = ['/v1/chat/completions','/chat/completions','/v1/responses','/v1/messages'];
                for (const p of known) {
                    if (state.settings.baseUrl && state.settings.baseUrl.endsWith(p)) {
                        state.settings.baseUrl = state.settings.baseUrl.slice(0, -p.length);
                        if (!savedSettings.endpointPath) {
                            state.settings.endpointPath = p;
                        }
                        break;
                    }
                }
            } else {
                state.settings = { ...defaultSettings };
            }
        } catch (e) {
            console.error("Failed to load settings from localStorage, using defaults.", e);
            state.settings = { ...defaultSettings };
        }

        dom.baseUrlInput.value = state.settings.baseUrl || '';
        dom.endpointPathInput.value = state.settings.endpointPath || '/chat/completions';
        dom.fullEndpointModeInput.checked = !!state.settings.fullEndpointMode;
        dom.apiKeyInput.value = state.settings.apiKey;
        dom.modelInput.value = state.settings.model;
        dom.systemPromptInput.value = state.settings.systemPrompt;
        dom.streamingSwitch.checked = state.settings.streaming !== false;

        dom.customHeadersContainer.innerHTML = '';
        dom.customBodyContainer.innerHTML = '';
        state.settings.customHeaders?.forEach(h => createParamRow(dom.customHeadersContainer, h.key, h.value, 'Name', 'Value'));
        state.settings.customBody?.forEach(b => createParamRow(dom.customBodyContainer, b.key, b.value, 'Key', 'Value'));

      function loadSessions() {

            state.sessions = JSON.parse(saved);
          }
        } catch (e) {
          console.error("Failed to load sessions from localStorage", e);

        }

        state.sessions.sort((a,b) => b.updatedAt - a.updatedAt);

        if (!newName) return;
        const session = {

      function renderChat() {
        dom.messagesContainer.innerHTML = '';
        const session = getCurrentSession();
        if (!session) return;
        
        session.messages.forEach((msg, index) => {
          if (msg.isFile) {
            try {
              const fileData = JSON.parse(msg.content);
              displayFileMessage(msg.role, fileData, index);
            } catch (e) {
              console.error('Error parsing file message', e);
              addMessage(msg.role, '文件显示错误', false, index, msg.reasoning);
            }
          } else {
            const messageElement = addMessage(msg.role, msg.content, false, index, msg.reasoning);
            
            if (msg.remembered) {
              messageElement.parentElement.classList.add('message-remembered');
            }
            
            if (msg.reasoning && msg.role === 'assistant') {
              const messageDiv = messageElement.parentElement;
              let thinkBar = messageDiv.querySelector('.tm-thinkbar');
            
              if (!thinkBar) {
                const finalTime = msg.reasoningMs ? (msg.reasoningMs/1000).toFixed(1) : null;
                thinkBar = createThinkingComponent(msg.reasoning, false, finalTime);
                messageDiv.insertBefore(thinkBar, messageElement);
              }
            
              thinkBar.style.display = 'block';
              thinkBar.style.opacity = '1';
            
              const timeElement = thinkBar.querySelector('.tm-time');
              if (timeElement && msg.reasoningMs) {
                timeElement.textContent = `(${(msg.reasoningMs/1000).toFixed(1)}s)`;
              }
            
              if (msg.reasoningCollapsed !== false) {
                thinkBar.classList.add('collapsed');
              } else {
                thinkBar.classList.remove('collapsed');
              }
            }
            
            if (msg.editable === false) {
              setMessageEditable(index, false);
            }
          }
        });

        _updateMessageActions();
      }
      
      function addMessage(role, content, animate = true, messageIndex = -1, thinking = null) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        messageDiv.dataset.messageIndex = messageIndex;

        if (role === 'assistant' && thinking) {
          const finalTime = thinking && thinking.length > 0 ? (thinking.length / 500).toFixed(1) : null;
        
          const thinkingComponent = createThinkingComponent(
            thinking, 
            false,
            finalTime
          );
          
          thinkingComponent.style.display = 'block';
          thinkingComponent.style.opacity = '1';
          
          messageDiv.appendChild(thinkingComponent);
        }

        if (role === 'user' && messageIndex !== -1) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'message-delete-btn';
          deleteBtn.setAttribute('aria-label', '删除消息');
          deleteBtn.innerHTML = icons.trash;
          deleteBtn.dataset.messageIndex = messageIndex;
          messageDiv.appendChild(deleteBtn);
        }

        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        if (role === 'assistant') {
            bubble.innerHTML = renderMarkdown(content);
        } else {
            bubble.textContent = content;
        }
        messageDiv.appendChild(bubble);

        if (role === 'assistant' && messageIndex !== -1) {
          const canvasEditor = createCanvasEditor(messageIndex, content);
          messageDiv.appendChild(canvasEditor);
        }

        dom.messagesContainer.appendChild(messageDiv);
        if (animate) {
           messageDiv.style.animation = 'messageSlideIn 0.35s var(--ios-spring)';
        } else {
           messageDiv.style.opacity = '1';
           messageDiv.style.transform = 'translateY(0)';
        }
        setTimeout(() => {
          dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
        }, 50);
        return bubble;
      }
      
      function _updateMessageActions() {
          const existingActions = document.querySelector('.message-actions');
          if (existingActions) {
              existingActions.remove();
          }
          const session = getCurrentSession();
          if (!session || session.messages.length === 0 || state.sending) {
              return;
          }
          const lastMessage = session.messages[session.messages.length - 1];
          if (lastMessage.role === 'assistant') {
              const lastMessageElement = dom.messagesContainer.querySelector('.message:last-child');
              if (lastMessageElement) {
                  const actionsContainer = document.createElement('div');
                  actionsContainer.className = 'message-actions';
                  
                  const regenerateBtn = document.createElement('button');
                  regenerateBtn.className = 'regenerate-btn';
                  regenerateBtn.innerHTML = `${icons.regenerate} 重新生成`;
                  regenerateBtn.onclick = handleRegenerate;
                  
                  const canvasBtn = document.createElement('button');
                  canvasBtn.className = 'canvas-action-btn';
                  canvasBtn.innerHTML = `${icons.edit} 编辑`;
                  canvasBtn.onclick = () => openCanvasEditor(session.messages.length - 1);
                  
                  actionsContainer.appendChild(regenerateBtn);
                  actionsContainer.appendChild(canvasBtn);
                  lastMessageElement.appendChild(actionsContainer);
              }
          }
      }
      
      function handleRegenerate() {
          const session = getCurrentSession();
          if (!session || state.sending || session.messages.length === 0) return;
          const lastMessage = session.messages[session.messages.length - 1];
          if (lastMessage.role === 'assistant') {
              session.messages.pop();
              saveSessions();
              renderChat();
              _executeSend();
          }
      }

      async function sendMessage() {

        const messageId = 'msg_' + Date.now() + '_' + Math.random().toString(36).substr(2, 9);

      // 添加获取最终端点的函数
      function getFinalEndpoint() {
        if (state.settings.fullEndpointMode) {
          return state.settings.baseUrl || '';
        } else {
          return joinUrl(state.settings.baseUrl, state.settings.endpointPath || '/chat/completions');
        }
      }

      // 添加构建请求头的函数
      function buildHeaders() {
        const defaultHeaders = {
          'Content-Type': 'application/json',
          ...(state.settings.apiKey && { 'Authorization': `Bearer ${state.settings.apiKey}` })
        };
        const customHeaders = state.settings.customHeaders?.reduce((acc, h) => {
          acc[h.key] = h.value;
          return acc;
        }, {}) || {};
        return { ...defaultHeaders, ...customHeaders };
      }

      async function _executeSend() {
        syncFormToState();
        
        let endpoint = getFinalEndpoint();
        
        if (!endpoint) {
          showToast('请先配置Base URL');
          openSidebar('settingsSidebar');
          return;
        }
        
        if (!state.settings.model) {
          showToast('请先配置模型ID');
          openSidebar('settingsSidebar');
          return;
        }
        
        const session = getCurrentSession();
        if(!session || session.messages.length === 0) return;
        _updateMessageActions();
        
        const forceCanvas = !!window.__canvasForce__;
        
        THINK.start();
        
        state.sending = true;
        state.abortController = new AbortController();
        showStopButton();
        
        try {
          let messages = [...session.messages];
          
          const { messages: msg2 } = MEMORY.pickAndInject({ messages, budgetChars: 1000, preview: true });
          messages = msg2;
          
          if (state.settings.systemPrompt) {
            messages.unshift({ role: 'system', content: state.settings.systemPrompt });
          }
          
          const useMemoryTool = isMemoryEnabled();
          const payload = {
            model: state.settings.model,
            messages,
            stream: state.settings.streaming && !useMemoryTool,
          };
          
          if (useMemoryTool) {
            payload.tools = [MEMORY_TOOL];
            payload.tool_choice = "auto";
          }
          
          // ✅ 追加自定义体
          mergeCustomBodyInto(payload, state);

          const response = await fetch(endpoint, {
            method: 'POST',
            headers: buildHeaders(),
            body: JSON.stringify(payload),
            signal: state.abortController.signal
          });

          if (!response.ok) {
            const errorText = await response.text();
            const classified = classifyApiError({
              url: endpoint,
              method: 'POST',
              status: response.status,
              body: errorText,
              headers: response.headers
            });
            throw new ApiError(classified.id, response.status, classified.message, classified.tips, errorText, response);
          }
          
          const wantStream = state.settings.streaming;
          const isSSE = wantStream && response.ok &&
                       (response.headers.get('content-type')||'').includes('text/event-stream') &&
                       response.body &&
                       typeof response.body.getReader === 'function';
          
          if (isSSE) {
            await parseSSEResponse(response, session, forceCanvas);
          } else {
            // 使用工具回路处理非流式响应
            const useMemoryTool = isMemoryEnabled();
            if (useMemoryTool) {
              const finalAnswer = await runWithTools(session.messages);
              const assistantBubble = addMessage('assistant', finalAnswer, true, session.messages.length);
              
              session.messages.push({ 
                role: 'assistant', 
                content: finalAnswer,
                canvas: forceCanvas,
                editable: true
              });
              
              setMessageEditable(session.messages.length - 1, true);
              
              session.updatedAt = Date.now();
              saveSessions();
            } else {
              await processNonStreamResponse(response, session, forceCanvas);
            }
          }
          
        } catch (error) {
            THINK.finish();
            
            if (error.name === 'AbortError') {
              addMessage('assistant', '(生成已被用户中断)');
            } else if (error instanceof ApiError) {
              console.error('API Error:', error);
              let errorMessage = error.message;
              if (error.tips && error.tips.length > 0) {
                errorMessage += '\n\n💡 建议：\n' + error.tips.map(tip => `• ${tip}`).join('\n');
              }
              addMessage('assistant', errorMessage);
            } else {
              let errorMessage = '抱歉，出错了: ' + error.message;
              if (error instanceof TypeError && error.message === 'Failed to fetch') {
                errorMessage = '网络请求失败。\n\n请检查：\n1. 后端服务是否已启动？\n2. 设置中的 Base URL/完整端点是否正确填写？\n3. 是否存在 CORS 跨域问题（可按 F12 查看控制台）？';
              }
              addMessage('assistant', errorMessage);
              console.error("Other error:", error);
            }
        } finally {
            state.sending = false;
            state.abortController = null;
            showSendButton();
            _updateMessageActions();
            
            MEMORY.incrementTurn();
        }
      }

      async function parseSSEResponse(response, session, forceCanvas) {
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';
        let fullContent = '';
        let thinkingContent = '';
        let isThinking = false;
        let thinkingFinished = false;
        
        const assistantBubble = addMessage('assistant', '', true, session.messages.length);
        setMessageEditable(session.messages.length, false);
        
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';
          for (const line of lines) {
            if (line.trim().startsWith('data:')) {
              const data = line.trim().slice(5).trim();
              if (data === '[DONE]') break;
              try {
                const json = JSON.parse(data);
                const delta = json.choices?.[0]?.delta?.content || '';
                const reasoning = json.choices?.[0]?.delta?.reasoning_content || '';
                
                if (reasoning) {
                  isThinking = true;
                  thinkingContent += reasoning;
                  THINK.chunk(reasoning);
                }
                
                if (isThinking && !reasoning && delta && !thinkingFinished) {
                  isThinking = false;
                  thinkingFinished = true;
                  THINK.finish(session.messages.length);
                  
                  fullContent += delta;
                  assistantBubble.innerHTML = renderMarkdown(fullContent);
                  dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
                } else if (delta && !isThinking) {
                  fullContent += delta;
                  assistantBubble.innerHTML = renderMarkdown(fullContent);
                  dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
                }
              } catch (e) {}
            }
          }
        }
        
        if (isThinking && !thinkingFinished) {
          THINK.finish(session.messages.length);
          thinkingFinished = true;
        }
        
        let finalAnswer = fullContent;
        
        if (forceCanvas) {
          const isHTML = /<\/?[a-z][\s\S]*>/i.test(fullContent);
          const lang = isHTML ? 'html' : 'markdown';
          finalAnswer = '```' + lang + '\n' + fullContent + '\n```';
          
          persistCanvasOnMsg(session.messages.length, true);
          
          window.__canvasForce__ = false;
          dom.composer.classList.remove('compose-highlight');
          
          const s = JSON.parse(localStorage.getItem('qb_menu_state') || '{}');
          s.canvas = false;
          localStorage.setItem('qb_menu_state', JSON.stringify(s));
          
          showToast('已生成Canvas输出');
        }
        
        assistantBubble.innerHTML = renderMarkdown(finalAnswer);
        
        session.messages.push({ 
          role: 'assistant', 
          content: finalAnswer,
          reasoning: thinkingContent || null,
          canvas: forceCanvas,
          editable: true
        });
        
        setMessageEditable(session.messages.length - 1, true);
        
        session.updatedAt = Date.now();
        saveSessions();
      }

      function extractReasoningFromResponse(json) {
        try {
          // OpenAI/兼容：choices[0].message.reasoning / thinking
          const ch0 = json?.choices?.[0];
          const msg = ch0?.message || ch0?.delta || {};
          const direct =
            msg.reasoning?.content ||
            msg.thinking?.content ||
            msg.reasoning ||
            msg.thinking;

          if (direct) return String(direct);

          // 一些厂商把思考塞在 tool / content 中
          const content = Array.isArray(msg.content) ? msg.content : [];
          const seg = content.find(c =>
            /reason|think|chain_of_thought|thought/i.test(c?.type || c?.role || '')
          );
          if (seg?.text) return String(seg.text);

          // OpenRouter/Anthropic 兼容：用 usage 里也许给了 reasoning 字段
          if (typeof json?.usage?.reasoning_tokens === 'number' && json?.usage?.reasoning_tokens > 0) {
            return '';
          }
        } catch (_) {}
        return '';
      }

      async function processNonStreamResponse(response, session, forceCanvas) {
        try {
          const data = await response.json();
          const fullContent = (
            data?.choices?.[0]?.message?.content ??
            data?.candidates?.[0]?.content?.parts?.map(p=>p.text).join('') ??
            data?.content?.[0]?.text ??
            data?.output_text ?? ''
          );
          
          if (!fullContent) {
            throw new Error('服务器返回的内容为空');
          }
          
          const reasoningText = extractReasoningFromResponse(data);
          
          if (reasoningText) {
            THINK.finish(session.messages.length, {
              timeText: '—',
              text: reasoningText
            });
          } else {
            THINK.finish(session.messages.length, {
              timeText: '—',
              text: '（服务端未返回思考内容）'
            });
          }
          
          const assistantBubble = addMessage('assistant', fullContent, true, session.messages.length);
          setMessageEditable(session.messages.length, false);
          
          let finalAnswer = fullContent;
          
          if (forceCanvas) {
            const isHTML = /<\/?[a-z][\s\S]*>/i.test(fullContent);
            const lang = isHTML ? 'html' : 'markdown';
            finalAnswer = '```' + lang + '\n' + fullContent + '\n```';
            
            persistCanvasOnMsg(session.messages.length, true);
            
            window.__canvasForce__ = false;
            dom.composer.classList.remove('compose-highlight');
            
            const s = JSON.parse(localStorage.getItem('qb_menu_state') || '{}');
            s.canvas = false;
            localStorage.setItem('qb_menu_state', JSON.stringify(s));
            
            showToast('已生成Canvas输出');
          }
          
          assistantBubble.innerHTML = renderMarkdown(finalAnswer);
          
          session.messages.push({ 
            role: 'assistant', 
            content: finalAnswer,
            reasoning: reasoningText || null,
            canvas: forceCanvas,
            editable: true
          });
          
          setMessageEditable(session.messages.length - 1, true);
          
          session.updatedAt = Date.now();
          saveSessions();
          
        } catch (error) {
          console.error('处理非流式响应出错:', error);
          addMessage('assistant', '解析服务器响应时出错: ' + error.message);
        }
      }
      
      function showTyping() {
        const messageDiv = document.createElement('div');
        messageDiv.className = 'message assistant';
        messageDiv.style.opacity = '1';
        messageDiv.style.transform = 'translateY(0)';
        messageDiv.innerHTML = `
          <div class="typing-indicator">

        dom.messagesContainer.appendChild(messageDiv);
        dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
        return messageDiv;
      }
      
      function renderMarkdown(text) {
          let html = '';
          let lastIndex = 0;
          const functionCallRegex = /<function_calls>([\s\S]*?)<\/function_calls>/g;
          let result;
          while((result = functionCallRegex.exec(text)) !== null) {
              const textBefore = text.slice(lastIndex, result.index);
              html += renderMarkdownText(textBefore);
              const functionCallContent = result[1];
              html += renderFunctionCallBlock(functionCallContent);
              lastIndex = result.index + result[0].length;
          }
          const remainingText = text.slice(lastIndex);
          html += renderMarkdownText(remainingText);
          return html;
      }
      
      function renderMarkdownText(text) {
          let html = '';
          let lastIndex = 0;
          const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
          let result;
          while((result = codeBlockRegex.exec(text)) !== null) {
              const [fullMatch, lang, code] = result;
              const textBefore = text.slice(lastIndex, result.index);
              html += escapeAndLinkify(textBefore);
              const codeName = extractCodeNameFromMarkdown(textBefore, lang, code);
              html += createCodeBlockHTML(lang, code, codeName);
              lastIndex = result.index + fullMatch.length;
          }
          const remainingText = text.slice(lastIndex);
          html += escapeAndLinkify(remainingText);
          return html;
      }
      
      function renderFunctionCallBlock(blockContent) {
          let blockHtml = '';
          const fileWriteRegex = /<invoke name="FileWrite">[\s\S]*?<parameter name="path">([\s\S]*?)<\/parameter>[\s\S]*?<parameter name="content">([\s\S]*?)<\/parameter>[\s\S]*?<\/invoke>/g;
          let result;
          while((result = fileWriteRegex.exec(blockContent)) !== null) {
              const path = result[1].trim();
              const content = result[2];
              const lang = path.split('.').pop() || 'text';
              blockHtml += createCodeBlockHTML(lang, content, path);
          }
          return blockHtml;
      }
      
      function extractCodeNameFromMarkdown(precedingText, lang, code) {
        const lines = precedingText.trim().split('\n');
        for (let i = lines.length - 1; i >= Math.max(0, lines.length - 3); i--) {
          const line = lines[i];
          const fileNamePattern = /([a-zA-Z0-9_.-]+\.(html|js|css|json|md|py|java|tsx|jsx|vue|php|cpp|c|h))/i;
          const match = line.match(fileNamePattern);
          if (match) return match[1];
        }
        
        if (lang.toLowerCase() === 'html') {
          const titleMatch = code.match(/<title>\s*(.*?)\s*<\/title>/i);
          if (titleMatch && titleMatch[1].trim()) {
            return titleMatch[1].trim() + '.html';
          }
          if (/<html|<!DOCTYPE|<body|<head/i.test(code)) {
            return 'index.html';
          }
        }
        
        if (lang.toLowerCase() === 'javascript' || lang.toLowerCase() === 'js') {
          if (/import\s+React|export\s+default|function\s+\w+\s*$.*$\s*{|const\s+\w+\s*=\s*\(/i.test(code)) {
            return 'Component.js';
          }
          return 'script.js';
        }
        
        if (lang.toLowerCase() === 'css') {
          return 'styles.css';
        }
        
        if (lang.toLowerCase() === 'python' || lang.toLowerCase() === 'py') {
          if (/def\s+main\s*\(|if\s+__name__\s*==\s*['"']__main__['"']/i.test(code)) {
            return 'main.py';
          }
          if (/class\s+\w+/i.test(code)) {
            return 'module.py';
          }
          return 'script.py';
        }
        
        if (/^#\s+/.test(code.trim())) {
          return 'README.md';
        }
        
        const langMap = {
          'javascript': 'script.js',
          'typescript': 'script.ts',
          'python': 'script.py',
          'java': 'Main.java',
          'cpp': 'main.cpp',
          'c': 'main.c',
          'html': 'index.html',
          'css': 'styles.css',
          'json': 'data.json',
          'xml': 'data.xml',
          'sql': 'query.sql',
          'bash': 'script.sh',
          'markdown': 'README.md'
        };
        
        return langMap[lang.toLowerCase()] || `Code File.${lang || 'txt'}`;
      }
      
      function createCodeBlockHTML(lang, code, title) {
          const safeLang = escapeHTML(lang || 'text');
          const safeCode = escapeHTML(code);
          const safeTitle = escapeHTML(title || 'Code File');
          const encodedCode = btoa(encodeURIComponent(code));
          const blockId = 'code-block-' + Date.now() + '-' + Math.random().toString(36).substr(2, 9);
          return `
            <div class="code-block-container" id="${blockId}" data-raw-code="${encodedCode}" data-lang="${safeLang}">
              <div class="code-block-header">
                <div class="code-icon-wrapper">${icons.globe}</div>
                <div class="code-info">
                  <span class="code-title">${safeTitle}</span>
                  <span class="code-lang-tag">${icons.code}${safeLang}</span>
                </div>
              </div>
              <div class="code-block-content">
                <pre><code>${safeCode}</code></pre>
              </div>
              <div class="code-editor-container">
                <div class="code-editor-wrapper">
                  <textarea class="code-editor" spellcheck="false">${code}</textarea>
                </div>
              </div>
              <div class="code-block-footer">
                 <div class="code-editor-controls" style="display:none;">
                  <button class="editor-btn editor-btn-cancel" data-action="cancel-edit">取消</button>
                  <button class="editor-btn editor-btn-save" data-action="save-edit">保存</button>
                </div>
                <button class="code-action-btn" data-action="edit">${icons.edit} 编辑</button>
                <button class="code-action-btn" data-action="copy">${icons.copy} 复制</button>
                <button class="code-action-btn" data-action="preview">${icons.preview} 预览</button>
                <button class="code-action-btn" data-action="open">${icons.open} 新窗口打开</button>
                <button class="code-action-btn" data-action="download">${icons.download} 下载</button>
              </div>
            </div>
      `;
      }
      
      function handleCodeBlockAction(e) {
          const btn = e.target.closest('.code-action-btn, .editor-btn');
          if (!btn) return;
          const container = btn.closest('.code-block-container');
          if (!container) return;
          const action = btn.dataset.action;
          if (action === 'edit') enterEditMode(container);
          else if (action === 'save-edit') saveCodeEdit(container);
          else if (action === 'cancel-edit') exitEditMode(container);
          else if (action === 'copy') copyCodeToClipboard(container);
          else handleOriginalCodeAction(container, action);
      }
      
      function enterEditMode(container) {
          container.classList.add('editing');
          const editor = container.querySelector('.code-editor');
          const editBtn = container.querySelector('[data-action="edit"]');
          const controls = container.querySelector('.code-editor-controls');
          container.querySelector('.code-block-footer').appendChild(controls);
          controls.style.display = 'flex';
          if (editor) {
              const currentCode = decodeURIComponent(atob(container.dataset.rawCode));
              editor.value = currentCode;
              if (editBtn) {
                  editBtn.style.display = 'none';
              }
              addLineNumbers(container);
              setTimeout(() => {
                  editor.focus();
                  editor.setSelectionRange(editor.value.length, editor.value.length);
              }, 10);
          }
      }
      
      function exitEditMode(container) {
          container.classList.remove('editing');
          const editBtn = container.querySelector('[data-action="edit"]');
          const editor = container.querySelector('.code-editor');
          const lineNumbers = container.querySelector('.line-numbers');
          const controls = container.querySelector('.code-editor-controls');
          if (editBtn) {
              editBtn.style.display = 'flex';
          }
           if (controls) {
              controls.style.display = 'none';
          }
          if (lineNumbers) {
              lineNumbers.remove();
          }
          if (editor) {
              editor.classList.remove('code-editor-with-lines');
              editor.style.height = ''; 
          }
      }
      
      function saveCodeEdit(container) {
          const editor = container.querySelector('.code-editor');
          const codeDisplay = container.querySelector('.code-block-content code');
          if (editor && codeDisplay) {
              const newCode = editor.value;
              codeDisplay.textContent = newCode;
              const encodedCode = btoa(encodeURIComponent(newCode));
              container.dataset.rawCode = encodedCode;
              updateMessageCode(container, newCode);
              exitEditMode(container);
              showToast('代码已保存');
          }
      }
      
      async function copyCodeToClipboard(container) {
          try {
              const code = decodeURIComponent(atob(container.dataset.rawCode));
              await navigator.clipboard.writeText(code);
              showToast('代码已复制到剪贴板');
          } catch(err) {
              showToast('复制失败');
          }
      }
      
      function handleOriginalCodeAction(container, action) {
          try {
              const code = decodeURIComponent(atob(container.dataset.rawCode));
              const lang = container.dataset.lang;
              if (action === 'preview' || action === 'open') {
                  const blob = new Blob([code], { type: lang === 'html' ? 'text/html;charset=utf-8' : 'text/plain;charset=utf-8' });
                  window.open(URL.createObjectURL(blob), '_blank');
              } else if (action === 'download') {
                  const blob = new Blob([code], { type: 'text/plain;charset=utf-8' });
                  const url = URL.createObjectURL(blob);
                  const a = document.createElement('a');
                  const fileName = container.querySelector('.code-title').textContent || `code.${lang || 'txt'}`;
                  a.href = url;
                  a.download = fileName;
                  document.body.appendChild(a);
                  a.click();
                  document.body.removeChild(a);
                  URL.revokeObjectURL(url);
                  showToast('文件已开始下载');
              }
          } catch(err) {
              showToast('操作失败');
          }
      }
      
      function updateMessageCode(container, newCode) {
          const messageElement = container.closest('.message');
          if (!messageElement) return;
          const messageIndex = Array.from(dom.messagesContainer.children).indexOf(messageElement);
          const session = getCurrentSession();
          if (session && session.messages[messageIndex]) {
              const message = session.messages[messageIndex];
              const allCodeBlocksInMessage = Array.from(messageElement.querySelectorAll('.code-block-container'));
              const blockIndexInDOM = allCodeBlocksInMessage.indexOf(container);
              if (blockIndexInDOM === -1) return;
              const codeBlockRegex = /```(\w*)\n([\s\S]*?)```/g;
              let currentIndex = 0;
              message.content = message.content.replace(codeBlockRegex, (originalBlock, lang, _oldCode) => {
                  if (currentIndex++ === blockIndexInDOM) {
                      return "```" + (lang || '') + "\n" + newCode + "\n```";
                  }
                  return originalBlock;
              });
              session.updatedAt = Date.now();
              saveSessions();
          }
      }
      
      function addLineNumbers(container) {
          const editor = container.querySelector('.code-editor');
          if (!editor || container.querySelector('.line-numbers')) return;
          const wrapper = container.querySelector('.code-editor-wrapper');
          let lineNumbers = document.createElement('div');
          lineNumbers.className = 'line-numbers';
          const update = () => {
              editor.style.height = 'auto';
              const lines = editor.value.split('\n').length;
              lineNumbers.innerHTML = Array.from({length: lines}, (_, i) => i + 1).join('<br>');
              const scrollHeight = editor.scrollHeight;
              editor.style.height = scrollHeight + 'px';
              lineNumbers.style.height = scrollHeight + 'px';
              const digits = String(lines).length;
              const PADDING = 16;
              const contentWidth = digits * 0.6; 
              lineNumbers.style.width = `calc(${contentWidth}em + ${PADDING}px)`;
          };
          wrapper.insertBefore(lineNumbers, editor);
          editor.addEventListener('input', update);
          update();
      }
      
      document.addEventListener('keydown', (e) => {
          const editingContainer = document.querySelector('.code-block-container.editing');
          if (!editingContainer) return;
          if ((e.metaKey || e.ctrlKey) && e.key === 's') {
              e.preventDefault();
              saveCodeEdit(editingContainer);
          } else if (e.key === 'Escape') {
              e.preventDefault();
              exitEditMode(editingContainer);
          }
          
          const activeCanvas = document.querySelector('.message-canvas-editor.active');
          if (activeCanvas) {
            const messageIndex = parseInt(activeCanvas.dataset.messageIndex);
            if ((e.metaKey || e.ctrlKey) && e.key === 's') {
              e.preventDefault();
              saveCanvasEdit(messageIndex);
            } else if (e.key === 'Escape') {
              e.preventDefault();
              closeCanvasEditor(messageIndex);
            }
          }
      });
      
      function formatDate(timestamp) {
        const date = new Date(timestamp);
        const now = new Date();
        const diff = (now.getTime() - date.getTime()) / 1000;
        if (diff < 60) return '刚刚';
        if (diff < 3600) return `${Math.floor(diff / 60)}分钟前`;
        if (diff < 86400) return `${Math.floor(diff / 3600)}小时前`;
        const yesterday = new Date();
        yesterday.setDate(now.getDate() - 1);
        if (date.getDate() === yesterday.getDate() && date.getMonth() === yesterday.getMonth() && date.getFullYear() === yesterday.getFullYear()) {
            return `昨天 ${date.getHours()}:${String(date.getMinutes()).padStart(2, '0')}`;
        }
        if (diff < 86400 * 7) return `${Math.floor(diff / 86400)}天前`;
        return date.toLocaleDateString();
      }
      
      function escapeAndLinkify(str) {
         return escapeHTML(str).replace(/\n/g, '<br>');
      }
      
      function escapeHTML(str) {
        const p = document.createElement('p');
        p.textContent = str;
        return p.innerHTML;
      }
      
      function displayFileMessage(role, fileData, messageIndex = -1) {
        const messageDiv = document.createElement('div');
        messageDiv.className = `message ${role}`;
        messageDiv.setAttribute('data-messageIndex', messageIndex);
        if (role === 'user' && messageIndex !== -1) {
          const deleteBtn = document.createElement('button');
          deleteBtn.className = 'message-delete-btn';
          deleteBtn.setAttribute('aria-label', '删除消息');
          deleteBtn.innerHTML = icons.trash;
          deleteBtn.dataset.messageIndex = messageIndex;
          messageDiv.appendChild(deleteBtn);
        }
        const bubble = document.createElement('div');
        bubble.className = 'message-bubble';
        if (fileData.type.startsWith('image/')) {
          const img = document.createElement('img');
          img.src = fileData.data;
          img.className = 'image-preview';
          img.alt = fileData.name;
          img.onclick = () => window.open(fileData.data, '_blank');
          bubble.appendChild(img);
        } else {
          const fileAttachment = document.createElement('div');
          fileAttachment.className = 'file-attachment';
          fileAttachment.innerHTML = `
            <div class="file-icon">${getFileIcon(fileData.type, fileData.name)}</div>
            <div class="file-info">
              <div class="file-name">${escapeHTML(fileData.name)}</div>
              <div class="file-size">${formatFileSize(fileData.size)}</div>
            </div>
            <button class="file-action">下载</button>`;
          fileAttachment.querySelector('.file-action').onclick = () => downloadFile(fileData.data, fileData.name);
          bubble.appendChild(fileAttachment);
        }
        messageDiv.appendChild(bubble);
        dom.messagesContainer.appendChild(messageDiv);
        messageDiv.style.animation = 'messageSlideIn 0.35s var(--ios-spring)';
        setTimeout(() => {
          dom.messagesContainer.scrollTop = dom.messagesContainer.scrollHeight;
        }, 50);
      }
      
      async function deleteMessage(messageIndex) {
        const session = getCurrentSession();
        if (!session || messageIndex < 0 || messageIndex >= session.messages.length) return;
        const confirmed = await showConfirm(
          '删除消息', 
          '确定要删除这条消息吗？如果是用户消息，相应的回复也会被删除。',
          '删除',
          '取消',
          true
        );
        if (!confirmed) return;
        if (session.messages[messageIndex].role === 'user' && 
            messageIndex + 1 < session.messages.length && 
            session.messages[messageIndex + 1].role === 'assistant') {
          session.messages.splice(messageIndex, 2);
        } else {
          session.messages.splice(messageIndex, 1);
        }
        session.updatedAt = Date.now();
        saveSessions();
        renderChat();
        showToast('消息已删除');
      }
      
      function getFileIcon(fileType, fileName) {
        if (fileType.startsWith('image/')) return icons.image;
        if (fileType.includes('pdf')) return icons.pdf;
        return icons.file;
      }
      
      function formatFileSize(bytes) {
        if (bytes < 1024) return bytes + ' B';
        if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
        return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
      }
      
      function downloadFile(dataUrl, fileName) {
        const link = document.createElement('a');
        link.href = dataUrl;
        link.download = fileName;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        showToast('文件已开始下载');
      }
      
      function initGestures() {
        const mainChat = document.querySelector('.main-chat');
        mainChat.addEventListener('touchstart', e => {
          state.touchStartX = e.touches[0].clientX;
        }, { passive: true });
        mainChat.addEventListener('touchend', e => {
          if (!state.touchStartX) return;
          const touchEndX = e.changedTouches[0].clientX;
          const diff = touchEndX - state.touchStartX;
          if (diff > 80) openSidebar('historySidebar');
          else if (diff < -80) openSidebar('settingsSidebar');
          state.touchStartX = 0;
        }, { passive: true });
      }
      
      async function handleMessageDelete(e) {
        const deleteBtn = e.target.closest('.message-delete-btn');
        if (!deleteBtn) return;
        const messageIndex = parseInt(deleteBtn.dataset.messageIndex);
        if (!isNaN(messageIndex)) {

      function createCanvasEditor(messageIndex, content) {

      function openCanvasEditor(messageIndex) {

        if (!messageElement) return;
        
        const canvasEditor = messageElement.querySelector('.message-canvas-editor');

      function closeCanvasEditor(messageIndex) {

        if (!messageElement) return;
        
        const canvasEditor = messageElement.querySelector('.message-canvas-editor');

        messageBubble.classList.remove('editing');

      function saveCanvasEdit(messageIndex) {
        const messageElement = dom.messagesContainer.querySelector(`.message[data-message-index="${messageIndex}"]`);
        if (!messageElement) return;
        
        const canvasEditor = messageElement.querySelector('.message-canvas-editor');
        const messageBubble = messageElement.querySelector('.message-bubble');
        const textarea = canvasEditor.querySelector('.canvas-textarea');
        
        const newContent = textarea.value.trim();
        if (!newContent) {
          showToast('内容不能为空');
          return;

        messageBubble.innerHTML = renderMarkdown(newContent);
        
        const session = getCurrentSession();
        if (session && session.messages[messageIndex]) {
          session.messages[messageIndex].content = newContent;
          session.updatedAt = Date.now();
          saveSessions();
        }
        
        closeCanvasEditor(messageIndex);
        showToast('内容已保存');
      }
      
      async function copyCanvasContent(messageIndex) {
        const messageElement = dom.messagesContainer.querySelector(`.message[data-message-index="${messageIndex}"]`);
        if (!messageElement) return;
        
        const textarea = messageElement.querySelector('.canvas-textarea');
        try {
          await navigator.clipboard.writeText(textarea.value);
          showToast('内容已复制到剪贴板');
        } catch (err) {
          showToast('复制失败');
        }
      }
      
      function openLastAssistantCanvas() {
        const session = getCurrentSession();
        if (!session || session.messages.length === 0) {
          showToast('暂无可编辑的消息');
          return;
        }
        
        for (let i = session.messages.length - 1; i >= 0; i--) {
          if (session.messages[i].role === 'assistant') {
            openCanvasEditor(i);
            return;
          }
        }
        
        showToast('暂无AI回复可编辑');
      }
      
      function handleCanvasAction(e) {
        const btn = e.target.closest('[data-action^="canvas"], [data-action$="-canvas"]');
        if (!btn) return;
        
        const canvasEditor = btn.closest('.message-canvas-editor');
        if (!canvasEditor) return;
        
        const messageIndex = parseInt(canvasEditor.dataset.messageIndex);
        const action = btn.dataset.action;
        
        if (action === 'save-canvas') saveCanvasEdit(messageIndex);
        else if (action === 'cancel-canvas') closeCanvasEditor(messageIndex);
        else if (action === 'copy-canvas') copyCanvasContent(messageIndex);
      }
      
      // 修复后的测试连接函数
      async function testApiConnection() {
        if (state.testingApi) return;
        
        syncFormToState();
        
        const chatEndpoint = getFinalEndpoint();
        
        if (!state.settings.baseUrl) {
          showApiStatus('warning', '请先配置Base URL', []);
          return;
        }
        
        state.testingApi = true;
        dom.testApiBtn.classList.add('loading');
        dom.testApiBtn.innerHTML = '<span class="spinner"></span> 测试中...';
        
        const headers = buildHeaders();
        
        try {
          let data = null;
          let lastErr = null;
          
          // 1) 优先用 GET 探针（/models /v1/models /deployments）
          for (const url of getProbeUrls()) {
            try {
              data = await smartFetch(url, { method: 'GET', headers }, 10000);
              // 能进来说明GET探针成功
              break;
            } catch (e) {
              // 常见"路径不支持GET/不存在"则继续尝试下一个探针；其他网络/权限错误直接抛出
              if (e && (e.status === 404 || e.status === 405 || e.status === 400)) {
                lastErr = e;
                continue;
              } else {
                throw e;
              }
            }
          }
          
          // 2) 如果所有GET探针都失败，降级：对聊天端点做一次最小化POST
          if (!data) {
            if (!chatEndpoint) {
              showApiStatus('warning', '请先配置完整端点或填充路径', []);
              return;
            }
            
            const payload = {
              model: state.settings.model,
              messages: [{ role: 'user', content: 'ping' }],
              stream: false,
              max_tokens: 1
            };
            
            data = await smartFetch(
              chatEndpoint,
              { method: 'POST', headers, body: JSON.stringify(payload) },
              10000
            );
          }
          
          // 3) 根据返回形态展示结果
          // /models 风格：{ data: [{id: 'xxx'}, ...] }
          if (data && Array.isArray(data.data)) {
            const modelExists = data.data.some(m => m && m.id === state.settings.model);
            if (modelExists) {
              showApiStatus('success', `连接成功！模型 "${state.settings.model}" 可用。`, []);
            } else {
              const preview = data.data.slice(0, 5).map(m => m.id).join(', ');
              const more = Math.max(0, data.data.length - 5);
              const modelList = more > 0 ? `${preview} 等${data.data.length}个模型` : preview;
              showApiStatus(
                'warning',
                `API连接成功，但当前选择的模型 "${state.settings.model}" 不在可用列表中。`,
                modelList ? [`可用模型: ${modelList}`, '请检查模型名称是否正确。'] : []
              );
            }
          } else {
            // 聊天POST成功或其它可用响应
            showApiStatus('success', 'API连接成功！', []);
          }
          
        } catch (error) {
          // 统一错误展示，沿用你现有的 ApiError 分类文案
          if (error instanceof ApiError) {
            showApiStatus('error', error.message || '连接失败', error.tips || []);
          } else {
            showApiStatus('error', '连接失败', ['请检查网络/代理/防火墙设置。']);
          }
        } finally {
          state.testingApi = false;
          dom.testApiBtn.classList.remove('loading');
          dom.testApiBtn.innerHTML = `
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M22 11.08V12a10 10 0 11-5.93-9.14"></path>
              <polyline points="22 4 12 14.01 9 11.01"></polyline>
            </svg>
            <span>测试API连接</span>
          `;
        }
      }
      
      function showApiStatus(type, message, tips = []) {
        const existingStatus = dom.apiStatusContainer.querySelector('.api-status');
        if (existingStatus) {
          existingStatus.remove();
        }
        
        const statusDiv = document.createElement('div');
        statusDiv.className = `api-status ${type}`;
        
        let icon = '';
        switch (type) {
          case 'success':
            icon = icons.success;
            break;
          case 'error':
            icon = icons.error;
            break;
          case 'warning':
            icon = icons.warning;
            break;
        }
        
        let tipsHtml = '';
        if (tips && tips.length > 0) {
          tipsHtml = `
            <div class="api-status-tips">
              <ul>
                ${tips.map(tip => `<li>${escapeHTML(tip)}</li>`).join('')}
              </ul>
            </div>
          `;
        }
        
        statusDiv.innerHTML = `
          <div class="api-status-icon">${icon}</div>
          <div class="api-status-content">
            <div class="api-status-message">${escapeHTML(message)}</div>
            ${tipsHtml}
          </div>
        `;
        
        dom.apiStatusContainer.appendChild(statusDiv);
      }
      
      function positionQuickMenu() {
        const pop = dom.qbPop;
        const btn = dom.btnSettings;
        if (!pop || !btn) return;

        pop.style.visibility = 'hidden';
        pop.classList.add('show');

        const br = btn.getBoundingClientRect();
        const pw = pop.offsetWidth;
        const ph = pop.offsetHeight;
        const vw = window.innerWidth;
        const vh = window.innerHeight;

        let top = br.top - ph - 8;
        if (top < 8) top = Math.min(br.bottom + 8, vh - ph - 8);

        let left = Math.min(Math.max(8, br.left), vw - pw - 8);

        pop.style.top = `${top}px`;
        pop.style.left = `${left}px`;
        pop.style.visibility = 'visible';
      }

      function toggleQuickMenu(e) {
        e?.stopPropagation();
        const pop = dom.qbPop;
        if (!pop) return;
        if (pop.classList.contains('show')) {
          pop.classList.remove('show');
        } else {
          positionQuickMenu();
          pop.classList.add('show');
        }
      }

      dom.btnSettings.addEventListener('click', toggleQuickMenu);

      document.addEventListener('click', (ev) => {
        const pop = dom.qbPop;
        if (!pop?.classList.contains('show')) return;
        if (ev.target === dom.btnSettings || dom.btnSettings.contains(ev.target)) return;
        if (pop.contains(ev.target)) return;
        pop.classList.remove('show');
      });

      window.addEventListener('resize', () => {
        if (dom.qbPop?.classList.contains('show')) positionQuickMenu();
      });
      
      function initQuickMenu() {
        const savedState = JSON.parse(localStorage.getItem('qb_menu_state') || '{}');
        
        const qbCanvasBtn = document.getElementById('qbCanvasBtn');
        if (qbCanvasBtn) {
          if (savedState.canvas) qbCanvasBtn.classList.add('active');
          
          qbCanvasBtn.addEventListener('click', () => {
            const isActive = qbCanvasBtn.classList.toggle('active');
            window.__canvasForce__ = isActive;
            const state = JSON.parse(localStorage.getItem('qb_menu_state') || '{}');
            state.canvas = isActive;
            localStorage.setItem('qb_menu_state', JSON.stringify(state));
            
            if (isActive) {
              dom.composer.classList.add('compose-highlight');
              showToast('Canvas模式已开启');
            } else {
              dom.composer.classList.remove('compose-highlight');
              showToast('Canvas模式已关闭');
            }
          });
        }
        
        const qbMemoryBtn = document.getElementById('qbMemoryBtn');
        if (qbMemoryBtn) {
          if (savedState.memory) qbMemoryBtn.classList.add('active');
          
          qbMemoryBtn.addEventListener('click', () => {
            const isActive = qbMemoryBtn.classList.toggle('active');
            window.__memoryOn__ = isActive;
            const state = JSON.parse(localStorage.getItem('qb_menu_state') || '{}');
            state.memory = isActive;
            localStorage.setItem('qb_menu_state', JSON.stringify(state));
            
            showToast(isActive ? '记忆功能已开启' : '记忆功能已关闭');
          });
        }
      }
      
      function renderHistory() {
        const search = dom.historySearch.value.toLowerCase();
        dom.historyList.innerHTML = '';
        const filtered = state.sessions.filter(session => {
          if (!search) return true;
          return session.name.toLowerCase().includes(search);
        });
        const fragment = document.createDocumentFragment();
        filtered.forEach(session => {
          const card = document.createElement('div');
          card.className = 'session-card';
          card.dataset.sessionId = session.id;
          if (session.id === state.currentSessionId) {
            card.classList.add('active-session');
          }
          card.innerHTML = `
            <div class="session-name">${escapeHTML(session.name)}</div>
            <div class="session-meta">
              ${session.messages.length} 条消息 · ${formatDate(session.updatedAt)}
            </div>
            <div class="session-actions">
              <button class="action-btn" data-action="rename">重命名</button>
              <button class="action-btn" data-action="export">导出</button>
              <button class="action-btn delete" data-action="delete">删除</button>
            </div>
          `;
          card.addEventListener('click', () => openSession(session.id));
          fragment.appendChild(card);
        });
        dom.historyList.appendChild(fragment);
      }
      
      async function handleHistoryAction(e) {
          if(e.target.matches('.action-btn')) {
              e.stopPropagation();
              const card = e.target.closest('.session-card');
              const sessionId = card.dataset.sessionId;
              const action = e.target.dataset.action;
              if (action === 'rename') await renameSession(sessionId);
              else if (action === 'export') exportSession(sessionId);
              else if (action === 'delete') await deleteSession(sessionId);
          }
      }
      
      function openSession(id) {
        state.currentSessionId = id;
        renderChat();
        renderHistory();
        closeSidebar('historySidebar');
      }
      
      async function renameSession(id) {
        const session = state.sessions.find(s => s.id === id);
        if (!session) return;
        const newName = await showPrompt('重命名对话', '请输入新的对话名称：', session.name);
        if (newName && newName.trim()) {
          session.name = newName.trim();
          session.updatedAt = Date.now();
          saveSessions();
          renderHistory();
          if (session.id === state.currentSessionId) {
            renderChat();
          }
        }
      }
      
      async function deleteSession(id) {
        const confirmed = await showConfirm(
          '删除对话', 
          '确定要永久删除这个对话吗？\n此操作无法撤销。', 
          '删除', 
          '取消',
          true
        );
        if (!confirmed) return;
        const index = state.sessions.findIndex(s => s.id === id);
        if (index > -1) {
          state.sessions.splice(index, 1);
          if (state.currentSessionId === id) {
            state.currentSessionId = state.sessions.length > 0 ? state.sessions[0].id : null;
            if (state.currentSessionId) {
                renderChat();
            } else {
                const session = {
                    id: 'session_' + Date.now(),
                    name: '新对话',
                    messages: [],
                    createdAt: Date.now(),
                    updatedAt: Date.now()
                  };
                  state.sessions.push(session);
                  state.currentSessionId = session.id;
                  renderChat();
            }
          }
          saveSessions();
          renderHistory();
        }
      }
      
      function exportSession(id) {
        const session = state.sessions.find(s => s.id === id);
        if (!session) return;
        let content = `AI-Assistant-Pro Chat Export\n`;
        content += `========================\n\n`;
        content += `Session Name: ${session.name}\n`;
        content += `Exported At: ${new Date().toLocaleString()}\n`;
        content += `Total Messages: ${session.messages.length}\n\n`;
        content += `------------------------\n\n`;
        session.messages.forEach(msg => {
            const role = msg.role.charAt(0).toUpperCase() + msg.role.slice(1);
            let msgContent = msg.content;
            if (msg.isFile) {
              try {
                const fileData = JSON.parse(msg.content);
                msgContent = `[File Attachment: ${fileData.name}]`;
              } catch(e) { msgContent = '[File Attachment Error]'; }
            }
            if (msg.reasoning) {
              content += `${role} (Thinking):\n${msg.reasoning}\n\n`;
            }
            content += `${role}:\n${msgContent}\n\n------------------------\n\n`;
        });
        const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        const fileName = `AI-Assistant-Pro - ${session.name.replace(/[\s\W]+/g, '_')}.txt`;
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
        showToast('对话已导出');
      }
      
      function openSidebar(id) {
        document.getElementById(id).classList.add('active');
        dom.overlay.classList.add('active');
        if (id === 'historySidebar') {
          renderHistory();
        } else if (id === 'settingsSidebar') {
          updateApiPathDisplay();
        }
      }
      
      function closeSidebar(sidebarId) {
        if (sidebarId) {
            document.getElementById(sidebarId).classList.remove('active');
        } else {
            document.querySelectorAll('.sidebar.active').forEach(s => s.classList.remove('active'));
        }
        dom.overlay.classList.remove('active');
        if (sidebarId === 'settingsSidebar') {
          syncFormToState();
        }
      }
      
      function showToast(message) {
        const existing = document.querySelector('.toast');
        if (existing) existing.remove();
        const toast = document.createElement('div');
        toast.className = 'toast';
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(() => toast.classList.add('show'), 10);
        setTimeout(() => {
          toast.classList.remove('show');
          setTimeout(() => toast.remove(), 300);
        }, 2500);
      }
      
      function bindEvents() {
        document.getElementById('historyBtn').addEventListener('click', () => openSidebar('historySidebar'));
        document.getElementById('settingsBtn').addEventListener('click', () => openSidebar('settingsSidebar'));
        document.querySelectorAll('.close-btn').forEach(btn => btn.addEventListener('click', () => closeSidebar(btn.dataset.sidebar)));
        dom.sendBtn.addEventListener('click', sendMessage);
        dom.stopBtn.addEventListener('click', stopGeneration);
        dom.newChatIconBtn.addEventListener('click', () => dom.filePicker.click());
        dom.filePicker.onchange = async (e) => {
          const files = Array.from(e.target.files || []);
          if (!files.length) return;

          const session = getCurrentSession();
          for (const f of files) {
            const data = await new Promise((res, rej) => {
              const r = new FileReader();
              r.onload = () => res(r.result);
              r.onerror = rej;
              r.readAsDataURL(f);
            });
            const payload = { name: f.name, type: f.type || 'application/octet-stream', size: f.size, data };
            session.messages.push({ role: 'user', isFile: true, content: JSON.stringify(payload) });
            displayFileMessage('user', payload, session.messages.length - 1);
          }
          session.updatedAt = Date.now();
          saveSessions();
          dom.filePicker.value = '';
          showToast('文件已上传');
        };
        dom.messageInput.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
          }
        });
        dom.modalInput.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            dom.modalConfirm.click();
          }
        });
        dom.messageInput.addEventListener('input', adjustInputHeight);
        document.getElementById('newChatBtn').addEventListener('click', createNewSession);
        document.getElementById('saveSettingsBtn').addEventListener('click', saveSettings);
        dom.baseUrlInput.addEventListener('input', updateApiPathDisplay);
        dom.endpointPathInput.addEventListener('input', updateApiPathDisplay);
        dom.fullEndpointModeInput.addEventListener('change', updateApiPathDisplay);
        dom.modelInput.addEventListener('input', updateApiPathDisplay);
        dom.apiKeyInput.addEventListener('input', updateApiPathDisplay);
        if (dom.streamingSwitch) {
          dom.streamingSwitch.addEventListener('change', (e) => {
            state.settings.streaming = e.target.checked;
            localStorage.setItem('lma_settings', JSON.stringify(state.settings));
            showToast(`流式输出已${e.target.checked ? '开启' : '关闭'}`);
          });
        }
        dom.historySearch.addEventListener('input', renderHistory);
        dom.historyList.addEventListener('click', handleHistoryAction);
        dom.overlay.addEventListener('click', () => closeSidebar());
        document.addEventListener('keydown', e => {
          if (e.key === 'Escape') {
            if (state.sending) {
              stopGeneration();
            } else if (dom.modalContainer.classList.contains('active')) {
              if (state.modalResolve) {
                state.modalResolve(false);
                state.modalResolve = null;
              }
              hideModal();
            }
          }
        });
        dom.messagesContainer.addEventListener('click', async (e) => {
            handleCodeBlockAction(e);
            handleCanvasAction(e);
            await handleMessageDelete(e);
        });
        dom.addHeaderBtn.addEventListener('click', () => createParamRow(dom.customHeadersContainer, '', '', 'Name', 'Value'));
        dom.addBodyBtn.addEventListener('click', () => createParamRow(dom.customBodyContainer, '', '', 'Key', 'Value'));
        
        dom.testApiBtn.addEventListener('click', testApiConnection);

        document.getElementById('openMemoryBtn')?.addEventListener('click', () => MEMORY.open());
        document.getElementById('memFab')?.addEventListener('click', () => MEMORY.open());
        document.getElementById('memClose')?.addEventListener('click', () => MEMORY.close());
        document.getElementById('memSearch')?.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') MEMORY.search(e.target.value.trim());
        });
        document.getElementById('memClear')?.addEventListener('click', () => MEMORY.clearAll());
        document.getElementById('memExport')?.addEventListener('click', () => MEMORY.export());
        document.getElementById('memBody')?.addEventListener('click', (e) => {
          const btn = e.target.closest('[data-action="mem-delete"]');
          if (btn) MEMORY.delete(btn.dataset.id);
        });
      }
      init();
    })();
</script>
